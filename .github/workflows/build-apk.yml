name: Build CineSnappa APK

# Runs on every push to main, or by hand from the Actions tab ("Run workflow").
# Each run publishes a GitHub Release with ready-to-install APKs.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      # Signing key lives in repo secrets (Settings > Secrets and variables > Actions),
      # never in the code. Same key every build, so updates install over the old app.
      KEYSTORE_BASE64: ${{ secrets.CINESNAPPA_KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.CINESNAPPA_KEYSTORE_PASSWORD }}
      KEY_ALIAS: cinesnappa
      # Optional: Trakt watch-history sync (trakt.tv > Settings > Your API Apps).
      TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
      TRAKT_CLIENT_SECRET: ${{ secrets.TRAKT_CLIENT_SECRET }}
      # Optional: built-in TMDB key (themoviedb.org > Settings > API > "API Key").
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Set version from run number
        id: version
        run: |
          base="$(grep '^MARKETING_VERSION=' iosApp/Configuration/Version.xcconfig | cut -d= -f2 | tr -d '[:space:]')"
          version="${base}.${GITHUB_RUN_NUMBER}"
          code=$((1000 + GITHUB_RUN_NUMBER))
          sed -i -E "s/^MARKETING_VERSION=.*/MARKETING_VERSION=${version}/" iosApp/Configuration/Version.xcconfig
          sed -i -E "s/^CURRENT_PROJECT_VERSION=.*/CURRENT_PROJECT_VERSION=${code}/" iosApp/Configuration/Version.xcconfig
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Building CineSnappa ${version} (code ${code})"

      - name: Configure signing
        run: |
          if [[ -z "${KEYSTORE_BASE64}" || -z "${KEYSTORE_PASSWORD}" ]]; then
            echo "::error::Add the CINESNAPPA_KEYSTORE_BASE64 and CINESNAPPA_KEYSTORE_PASSWORD repo secrets first (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          store="${RUNNER_TEMP}/cinesnappa.jks"
          printf '%s' "${KEYSTORE_BASE64}" | base64 --decode > "${store}"
          {
            echo "NUVIO_RELEASE_STORE_FILE=${store}"
            echo "NUVIO_RELEASE_STORE_PASSWORD=${KEYSTORE_PASSWORD}"
            echo "NUVIO_RELEASE_KEY_ALIAS=${KEY_ALIAS}"
            echo "NUVIO_RELEASE_KEY_PASSWORD=${KEYSTORE_PASSWORD}"
            if [[ -n "${TRAKT_CLIENT_ID}" ]]; then
              echo "TRAKT_CLIENT_ID=${TRAKT_CLIENT_ID}"
              echo "TRAKT_CLIENT_SECRET=${TRAKT_CLIENT_SECRET}"
              echo "TRAKT_REDIRECT_URI=cinesnappa://auth/trakt"
            fi
          } > local.properties

      - name: Insert TMDB key
        run: |
          if [[ -n "${TMDB_API_KEY}" ]]; then
            key="$(printf '%s' "${TMDB_API_KEY}" | tr -d '[:space:]')"
            sed -i "s|__CINESNAPPA_TMDB_API_KEY__|${key}|" composeApp/src/commonMain/kotlin/com/nuvio/app/features/tmdb/CineSnappaTmdbDefaults.kt
            echo "TMDB key inserted"
          else
            echo "No TMDB_API_KEY secret; users can add their own key in Settings"
          fi

      - name: Build APKs
        run: ./gradlew :androidApp:assembleFullRelease --stacktrace

      - name: Rename APKs
        run: |
          mkdir -p dist
          for apk in androidApp/build/outputs/apk/full/release/*.apk; do
            abi="$(basename "$apk" | sed -E 's/^androidApp-full-(.*)-release\.apk$/\1/')"
            cp "$apk" "dist/CineSnappa-${{ steps.version.outputs.version }}-${abi}.apk"
          done
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: CineSnappa-${{ steps.version.outputs.version }}
          path: dist/*.apk
          if-no-files-found: error

      - name: Publish release
        run: |
          tag="v${{ steps.version.outputs.version }}"
          cat > notes.md <<'EOF'
          **Which file do I download?**
          - Most phones (2017 and newer): **arm64-v8a**
          - Older or cheap phones / some TV boxes: **armeabi-v7a**
          - PC emulators: x86_64

          Tap the APK on your phone, allow "Install unknown apps", then Install.
          EOF
          gh release create "$tag" dist/*.apk \
            --target "${GITHUB_REF_NAME}" \
            --title "CineSnappa ${{ steps.version.outputs.version }}" \
            --notes-file notes.md
